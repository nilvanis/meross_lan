name: Home pull request checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact candidate commit SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/home-checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  required:
    name: home/checks
    if: always() && github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to succeed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  status:
    name: Record required home status
    if: always() && github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
          RESULT: ${{ needs.checks.result }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Expected a full candidate SHA');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha,
              state: process.env.RESULT === 'success' ? 'success' : 'failure',
              context: 'home/checks',
              description: 'Integration, AUTO contract, metadata and automation checks',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
