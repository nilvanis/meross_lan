name: Import stable upstream releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: home-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'nilvanis/meross_lan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Merge release and prepare one PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          AUTOMATION_TOKEN: ${{ github.token }}
          SYNC_CUSTOM_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: python scripts/home_sync.py
